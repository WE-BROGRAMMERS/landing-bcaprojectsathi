<app-breadcrumb></app-breadcrumb>

<section id="contact-2" class="contact-2 section" *ngIf="contactInfo() as contactInfo">

    <!-- Map Section -->
    <div class="map-container m-5">
        <iframe [src]="contactInfo?.mapUrl | safeurl" 
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

    <div class="container" data-aos="fade-up" data-aos-delay="100">

        <!-- Contact Info ... (keep as is) -->

        <!-- Contact Form -->
        <div class="row justify-content-center mb-5" data-aos="fade-up" data-aos-delay="200">
            <div class="col-lg-10">
                <div class="contact-form-wrapper">
                    <h2 class="text-center mb-4">Send a Message</h2>

                    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="text" class="form-control" formControlName="name" placeholder="Your Name">
                                    <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger small">
                                        Name is required (min 2 chars).
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="form-group">
                                    <input type="email" class="form-control" formControlName="email" placeholder="Email Address">
                                    <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger small">
                                        Valid email is required.
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <input type="text" class="form-control" formControlName="subject" placeholder="Subject">
                                    <div *ngIf="f['subject'].touched && f['subject'].invalid" class="text-danger small">
                                        Subject is required (min 3 chars).
                                    </div>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="form-group">
                                    <textarea class="form-control" formControlName="message" placeholder="Your Message" rows="6"></textarea>
                                    <div *ngIf="f['message'].touched && f['message'].invalid" class="text-danger small">
                                        Message is required (min 10 chars).
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 text-center">
                                <button type="submit" class="btn-submit" [disabled]="loading">
                                    <span *ngIf="!loading">SEND MESSAGE</span>
                                    <span *ngIf="loading"><i class="bi bi-arrow-repeat"></i> Sending...</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</section>
